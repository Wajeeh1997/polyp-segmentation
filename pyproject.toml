[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polypseg"
version = "0.1.0"
description = "Polyp segmentation on Kvasir-SEG: PyTorch U-Net (ResNet34 encoder), FastAPI service, Docker."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
train = ["matplotlib>=3.7", "pyyaml>=6.0", "tqdm>=4.65"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
polypseg-train = "polypseg.train:main"
polypseg-predict = "polypseg.predict:main"
polypseg-download = "polypseg.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
